name: Publish packages

# Pushes the Fuaran.Program.* packs to nuget.org — the public, no-auth-restore
# distribution channel. Triggered by a tag push matching `v*` (the "ship this
# release" gesture) or by workflow_dispatch (the rerun-against-an-existing-tag
# escape hatch). NOTHING here is reachable from an ordinary branch push: a push
# to a branch creates no tag, so publication stays a deliberate act rather than
# a side effect of landing work.
#
# The version baked into each pack is the <Version> property in
# Directory.Build.props at the tagged commit. A tag naming one version while the
# props file says another publishes what the props file says — check them
# against each other before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # `id-token: write` lets the job request the GitHub OIDC token that
  # nuget.org's Trusted Publishing exchange turns into a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # nuget.config declares a `local` folder source at ../../local-nuget-feed,
      # relative to the repo root. On the runner there is no such folder, and
      # NuGet HARD-ERRORS on a missing folder source (NU1301) rather than
      # treating it as empty — so mint it at exactly that depth. Getting the
      # depth wrong is the same NU1301 with the same message.
      #
      # It stays empty, which is the point: every Fuaran.Core.* dependency then
      # resolves from nuget.org, exactly as a consumer of the published packages
      # will. A pin only a maintainer's machine can serve fails HERE rather than
      # in someone else's restore.
      - name: Create empty local folder feed on the runner
        run: mkdir -p ../../local-nuget-feed

      # The four packable projects — the core packages — named rather than
      # packing the solution, which would also walk the test assemblies.
      #
      # The two UI adapter packages (Fuaran.Program.UI, Fuaran.Program.Server.UI)
      # were packed here from 0.6.0 to 0.7.1 and are NOT any more: they moved to
      # the UI tier's repository in fuaran#2012 (DECISIONS.md D32), which
      # publishes them under the same ids in its own version line. 0.7.1 is the
      # last version of either published from this repository.
      - name: Pack
        run: |
          for proj in \
            src/Fuaran.Program/Fuaran.Program.fsproj \
            src/Fuaran.Program.Bounded/Fuaran.Program.Bounded.fsproj \
            src/Fuaran.Program.Runtime/Fuaran.Program.Runtime.fsproj \
            src/Fuaran.Program.Server/Fuaran.Program.Server.fsproj
          do
            dotnet pack "$proj" -c Release -o "$GITHUB_WORKSPACE/artifacts" --nologo
          done

      # Auth is Trusted Publishing (OIDC): a policy on nuget.org (repository
      # owner / repository / this workflow's file name / the package id pattern)
      # exchanges the job's OIDC token for a 1-hour API key — no long-lived key
      # secret to rotate. `user` is the nuget.org profile name the policy
      # belongs to. The login sits immediately before the push so the temporary
      # key cannot expire mid-run.
      #
      # An UNREGISTERED policy fails loudly here rather than silently publishing
      # nothing, which is the correct failure but reads as an auth error — if
      # this step fails on a first release, check the policy exists before
      # checking anything else.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ajwillshire # the policy owner (a nuget.org profile name is public, not a secret)

      - name: Push to nuget.org
        run: |
          # Push from the repo-local artifacts dir the Pack step wrote. Never
          # glob a shared folder feed: on any machine that has packed more than
          # this repository, such a glob enumerates packages this workflow has
          # no business publishing, and --skip-duplicate would not save it —
          # ids that do not exist on nuget.org would be CREATED, not skipped.
          #
          # nullglob so an empty dir yields an empty list rather than the
          # literal pattern, and push each package individually: `dotnet nuget
          # push` takes a single root path and does not shell-expand a quoted
          # wildcard.
          shopt -s nullglob
          pkgs=("$GITHUB_WORKSPACE"/artifacts/*.nupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in artifacts/ — Pack produced nothing." >&2
            exit 1
          fi
          # Defence in depth behind the dedicated output dir: every packable
          # project here carries a Fuaran.Program* id, so anything else reaching
          # this loop means the output dir was re-pointed somewhere shared.
          # Refuse rather than publish it.
          for pkg in "${pkgs[@]}"; do
            case "$(basename "$pkg")" in
              Fuaran.Program.*) ;;
              *)
                echo "refusing to push unexpected package id: $(basename "$pkg")" >&2
                echo "this workflow publishes only this repository's own Fuaran.Program* packs." >&2
                exit 1
                ;;
            esac
          done
          for pkg in "${pkgs[@]}"; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done

  # Phase 2383 (DECISIONS.md D67) — a publish also attaches THE PROOF MODELS' RELEASE ASSET,
  # `proofs-program-<Version>.tar`: the models, the runtime floor and the extractions another
  # repository's proof leg re-checks, pinned there by sha256 instead of copied. The job builds it
  # with `proofs/check.ps1 -AssetOnly` (the proof kit's builder, from the kit asset pinned in
  # proofs/proofs-kit.json and verified before it is unpacked; reproducible, so its sha256 is a
  # function of the declared files alone), which REFUSES to go on when that sha is not the one
  # proofs/asset.json commits. It attaches the asset to the `v<Version>` GitHub release, creating
  # the release when the tag has none; an asset already attached is downloaded and compared instead
  # of replaced (the same bytes pass, different bytes fail the job). It then downloads the asset from
  # its public url and checks the sha once more, so what a consumer's pin fetches is what was
  # verified. TAG-ONLY: a dispatch on a branch skips it, and a tag that does not name <Version> is
  # refused before anything is built. The one job granted `contents: write`.
  proofs-asset:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a tag that does not name <Version>
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-Xml -Path Directory.Build.props -XPath '//PropertyGroup/Version' | Select-Object -First 1).Node.InnerText.Trim()
          if ($env:TAG -ne "v$version") { throw "the tag $($env:TAG) does not name Directory.Build.props's <Version> $version; no asset is built for it" }

      - name: Build the asset and hold it to proofs/asset.json's sha256
        shell: pwsh
        run: pwsh ./proofs/check.ps1 -AssetOnly -AssetOutDir "${{ runner.temp }}/proofs-asset"

      - name: Attach it to the release for the tag, never replacing different bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $asset = "proofs-program-$version.tar"
          $built = Join-Path "${{ runner.temp }}/proofs-asset" $asset
          $sha = (Get-Content proofs/asset.json -Raw | ConvertFrom-Json).sha256
          if ((Get-FileHash $built -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw "$built is not the committed sha256 $sha" }
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
              gh release create $env:TAG --verify-tag --title $env:TAG --notes "Fuaran.Program $version. The proof models for this release are $asset, sha256 $sha (proofs/README.md, The release asset)."
              if ($LASTEXITCODE -ne 0) { throw "could not create the release for $($env:TAG)" }
          }
          $attached = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          if ($attached -contains $asset) {
              $existing = Join-Path "${{ runner.temp }}" "attached-$asset"
              gh release download $env:TAG --pattern $asset --output $existing --clobber
              $existingSha = (Get-FileHash $existing -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existingSha -ne $sha) { throw "$asset is already attached to $($env:TAG) with sha256 $existingSha, not the committed $sha. Nothing was replaced." }
              Write-Host "$asset is already attached with the committed sha256 $sha"
          }
          else {
              gh release upload $env:TAG $built
              if ($LASTEXITCODE -ne 0) { throw "could not attach $asset to $($env:TAG)" }
          }

      - name: Fetch the asset from its public url and check the sha once more
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/proofs-program-$version.tar"
          $sha = (Get-Content proofs/asset.json -Raw | ConvertFrom-Json).sha256
          $fetched = Join-Path "${{ runner.temp }}" "fetched-proofs-program-$version.tar"
          Invoke-WebRequest -Uri $url -OutFile $fetched -MaximumRedirection 5
          $fetchedSha = (Get-FileHash $fetched -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fetchedSha -ne $sha) { throw "$url serves sha256 $fetchedSha, not the committed $sha" }
          Write-Host "$url serves the committed sha256 $sha"
