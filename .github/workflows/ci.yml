name: CI

# Phase 1678 — the repo-wide build-and-verify lane. THE gate this repo defines
# for itself (`run.ps1`), reached from a push.
#
# Until this landed there was no CI here at all: `.github/workflows/` held only
# `publish-packages.yml`, so a push to `main` was verified by nothing but a
# contributor's local run, and the standing "tag on a green CI run" authorisation
# had no run to point at — which is why `v0.3.0` had to be cut on a local gate by
# operator instruction on 2026-09-04.
#
# ── What it runs ─────────────────────────────────────────────────────────────
# The repo's own gate verbatim — `pwsh ./run.ps1` = tool restore -> fantomas ->
# pin preflight -> build -> every Expecto test project -> the Fable parity leg.
# Nothing is curated out. A CI-only subset drifts from what a maintainer runs and
# the divergence is invisible from both sides.
#
# ── Layout mirrors a workspace checkout, and that is load-bearing ────────────
# Two paths in this repository are resolved RELATIVE TO THE REPO ROOT and cannot
# be satisfied by a bare single-repo checkout:
#
#   * `nuget.config` declares a `local` folder source at `../../local-nuget-feed`.
#     NuGet hard-errors on a MISSING folder source (NU1301) rather than treating
#     it as empty, so the directory must exist even though it will hold nothing;
#     the published `Fuaran.UI.*` pins then resolve anonymously from nuget.org.
#   * The conformance and parity suites resolve the wire corpus from the source
#     tree as `../../../Fuaran-UI/fuaran-program-spec` (`FUARAN_PROGRAM_SPEC`
#     overrides it).
#
# So the runner is assembled as the workspace those paths expect:
#
#     $GITHUB_WORKSPACE/
#     ├── Fuaran/
#     │   ├── Fuaran-Program/                 <- this repo
#     │   └── Fuaran-UI/fuaran-program-spec/  <- the wire corpus
#     └── local-nuget-feed/                   <- empty, for NU1301
#
# ── The corpus is a BUILD INPUT, and it is public ────────────────────────────
# The suites FAIL rather than skip when the corpus is absent — a conformance
# check that goes green without its oracle is worse than no check. The corpus
# repository is public (Fuaran-Core/fuaran-program-specification), so this
# workflow fetches it with no credential, on every run including fork pull
# requests, and a run that cannot fetch it FAILS at `Corpus status`. (Until the
# specification went public the corpus needed a token and a fork run reported the
# conformance legs as visibly skipped; those skip steps remain below, now
# unreachable, and go with the next edit that touches them.)
#
# `Assert the gate partition is exhaustive` is what keeps that honest over time.
# The reduced lane is `run.ps1 -Lane pure` - the runners `run.ps1` itself names in
# its `$pureRunners` list, which the step READS rather than copying - plus the
# corpus-free runners the pure lane leaves out, named once in this file. The step
# recomputes the set of Expecto runners exactly as `run.ps1` does and fails if any
# is in none of the three sets, so a new test project reddens CI until it is
# assigned, instead of silently running in neither lane.
#
# ── No deploy ────────────────────────────────────────────────────────────────
# Build-and-verify only. No deploy job, no artifact, no package push, no
# `workflow_run` chain; `permissions` is read-only. Publication stays where it
# was: `publish-packages.yml` on a `v*` TAG push, which a branch push never
# creates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: run.ps1
    runs-on: ubuntu-latest
    # The whole gate: five Expecto runners plus the Fable parity compile and run.
    # Generous, and an upper bound rather than a target — a run that reaches it
    # has hung, which is worth failing on.
    timeout-minutes: 60

    env:
      SPEC: Fuaran/Fuaran-UI/fuaran-program-spec

    steps:
      - name: Checkout fuaran-program
        uses: actions/checkout@v4
        with:
          path: Fuaran/Fuaran-Program

      # UNPINNED on purpose: the corpus is the normative oracle this tier
      # certifies against, and one current specification for every host is the
      # point of giving it a single home.
      - name: Checkout the program wire corpus
        uses: actions/checkout@v4
        with:
          repository: Fuaran-Core/fuaran-program-specification
          path: Fuaran/Fuaran-UI/fuaran-program-spec

      - name: Corpus status
        id: status
        run: |
          if [ -f "$SPEC/wire-fixtures/manifest.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Conformance corpus present::The FULL gate runs, conformance and parity included."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Conformance corpus ABSENT::The program wire corpus could not be fetched from its public repository (Fuaran-Core/fuaran-program-specification). It is a build input, and a conformance check without its oracle is not run as a pass."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: Fuaran/Fuaran-Program/global.json

      # The Fable parity leg is a `node` run, not merely a compile: "it compiles
      # under Fable" and "it behaves the same under Fable" are different claims
      # and only the second one matters.
      - name: Setup Node
        if: ${{ steps.status.outputs.present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the empty local NuGet feed dir (NU1301 workaround)
        run: mkdir -p local-nuget-feed

      - name: Assert the gate partition is exhaustive
        working-directory: Fuaran/Fuaran-Program
        shell: pwsh
        run: |
          # Recomputed exactly as run.ps1 selects its runners, so this cannot
          # drift from the gate it describes.
          $runners =
              Get-ChildItem -Path tests -Directory |
                  Where-Object { Get-ChildItem -Path $_.FullName -Filter *.fsproj -File } |
                  Where-Object { (Get-Content (Get-ChildItem -Path $_.FullName -Filter *.fsproj -File)[0].FullName -Raw) -match '<OutputType>Exe</OutputType>' } |
                  ForEach-Object { $_.Name } | Sort-Object
          # The pure lane is run.ps1's own list, read from its parse tree - not a
          # second copy kept here.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./run.ps1).Path, [ref]$null, [ref]$null)
          $assign = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$pureRunners' }, $true)
          if (-not $assign) {
              Write-Error 'run.ps1 declares no $pureRunners list; the reduced lane has nothing to run.'
              exit 1
          }
          $pure = @($assign.Right.FindAll({ param($n) $n -is [System.Management.Automation.Language.StringConstantExpressionAst] }, $true) | ForEach-Object { $_.Value })
          # Empty since fuaran#2012: the two pure runners were UI-typed suites and left
          # with the UI adapters. run.ps1 declares the empty list deliberately.
          # The corpus-free runners the pure lane leaves out (it runs only the suites
          # that read neither the filesystem nor the corpus). Named ONCE; the reduced
          # job runs them after the pure lane.
          $corpusFreeOutsidePure = @('Fuaran.Program.Tests', 'Fuaran.Program.Bench')
          $corpusBound = @()
          $known = $pure + $corpusFreeOutsidePure + $corpusBound
          $unclassified = $runners | Where-Object { $_ -notin $known }
          if ($unclassified) {
              Write-Error ("Expecto runner(s) in no CI lane: $($unclassified -join ', '). " +
                  'Add each to $pureRunners in run.ps1, or to the corpus-free or corpus-bound list in ' +
                  ".github/workflows/ci.yml - an unclassified runner does not run at all when the corpus is absent.")
              exit 1
          }
          $missing = $known | Where-Object { $_ -notin $runners }
          if ($missing) {
              Write-Error ("run.ps1 or ci.yml names runner(s) that no longer exist: $($missing -join ', ').")
              exit 1
          }
          Write-Host "partition OK: $($runners.Count) runner(s), all classified ($($pure.Count) pure from run.ps1)."

      # ── The full gate, when the corpus is available ─────────────────────────
      - name: The repo gate (pwsh ./run.ps1)
        if: ${{ steps.status.outputs.present == 'true' }}
        working-directory: Fuaran/Fuaran-Program
        shell: pwsh
        run: ./run.ps1

      # ── The reduced gate, when it is not ────────────────────────────────────
      # `run.ps1 -Lane pure` is the repo's own corpus-free lane: the same tool
      # restore, format, pin preflight and build, then only the runners it names
      # as reading neither the filesystem nor the corpus. It skips the Fable parity
      # leg and says so. The lane cannot be widened to include a corpus-bound
      # runner - a local gate that can be talked out of its oracle is not a gate -
      # so the reduced job adds the remaining corpus-free runners by name below.
      - name: Reduced gate - the pure lane (pwsh ./run.ps1 -Lane pure)
        if: ${{ steps.status.outputs.present != 'true' }}
        working-directory: Fuaran/Fuaran-Program
        shell: pwsh
        run: ./run.ps1 -Lane pure

      - name: Reduced gate - the corpus-free runners outside the pure lane
        if: ${{ steps.status.outputs.present != 'true' }}
        working-directory: Fuaran/Fuaran-Program
        shell: pwsh
        run: |
          foreach ($p in @('Fuaran.Program.Tests', 'Fuaran.Program.Bench')) {
              Write-Host "-- tests: $p --"
              dotnet run --project (Join-Path 'tests' $p)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: SKIPPED — wire conformance and Fable parity (corpus unavailable)
        if: ${{ steps.status.outputs.present != 'true' }}
        run: |
          echo "NOT RUN in this job: the Fable parity leg, which certifies against the program"
          echo "wire corpus (the UI-typed suites that also did left with the UI adapters, fuaran#2012),"
          echo "which this runner could not fetch. See the warning annotation on this run."
          echo "This is a visible skip, not a pass: the run makes no conformance claim."
